name: xiaomao

services:
  backend:
    build:
      context: ./express-project
      dockerfile: Dockerfile

    container_name: xiaomao-backend
    restart: unless-stopped

    user: "${XIAOMAO_UID:-1000}:${XIAOMAO_GID:-1000}"

    env_file:
      - ./.env

    ports:
      - "127.0.0.1:1220:3001"

    volumes:
      - "${XIAOMAO_UPLOAD_DIR:?Set XIAOMAO_UPLOAD_DIR in .env}:/app/uploads"

    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
