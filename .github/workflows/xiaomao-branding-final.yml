name: Finalize XiaoMao branding

"on":
  push:
    branches:
      - chore/xiaomao-branding-final

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Apply naming and logo changes
        run: python3 .github/scripts/finalize_xiaomao_branding.py

      - name: Verify legacy branding is gone
        shell: bash
        run: |
          if git grep -n -I -E '石榴|XiaoShiLiu|Xiaoshiliu|XIAOSHILIU|xiaoshiliu'; then
            echo 'Legacy branding remains in tracked text files.' >&2
            exit 1
          fi
          legacy_paths="$(find . -path './.git' -prune -o \( -name '*小石榴*' -o -name '*XiaoShiLiu*' -o -name '*xiaoshiliu*' \) -print)"
          if [ -n "$legacy_paths" ]; then
            echo 'Legacy branding remains in file or directory names:' >&2
            printf '%s\n' "$legacy_paths" >&2
            exit 1
          fi
          test -f vue3-project/src/assets/imgs/小毛毛.png
          test -f vue3-project/src/assets/imgs/小毛毛图标.png
          test -f vue3-project/public/logo.ico
          grep -F 'VITE_APP_TITLE=小毛毛 - 毛毛的快乐狗生' vue3-project/.env.example

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue3-project/package-lock.json

      - name: Verify frontend build
        working-directory: vue3-project
        run: |
          npm ci
          npm run build

      - name: Commit final branding
        shell: bash
        run: |
          rm -f .github/workflows/xiaomao-branding-final.yml
          rm -f .github/scripts/finalize_xiaomao_branding.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No branding changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize XiaoMao branding and logo'
          git push origin HEAD:${GITHUB_REF_NAME}
