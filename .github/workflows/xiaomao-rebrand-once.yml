name: XiaoMao One-time Rebrand

on:
  push:
    branches:
      - chore/xiaomao-full-rebrand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/xiaomao-full-rebrand
          fetch-depth: 0

      - name: Replace old branding everywhere
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', '.github', 'node_modules', 'dist', 'coverage'}
          text_exts = {
              '.vue', '.js', '.ts', '.jsx', '.tsx', '.json', '.md', '.html', '.css', '.scss',
              '.sql', '.yml', '.yaml', '.env', '.example', '.txt', '.sh', '.ps1', '.conf'
          }
          special_names = {'.env.docker', '.env.example', 'Dockerfile'}

          replacements = [
              ('小石榴号', '毛毛号'),
              ('石榴号', '毛毛号'),
              ('小石榴', '小毛毛'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() not in text_exts and path.name not in special_names:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              new = new.replace('@/assets/imgs/小毛毛.png', '@/assets/imgs/小毛毛.svg')
              new = new.replace('src/assets/imgs/小毛毛.png', 'src/assets/imgs/小毛毛.svg')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} text files')
          for item in changed:
              print(item)
          PY

      - name: Install new XiaoMao paw logo
        shell: bash
        run: |
          mkdir -p vue3-project/src/assets/imgs
          cat > vue3-project/src/assets/imgs/小毛毛.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="260" height="96" viewBox="0 0 260 96" role="img" aria-labelledby="title desc">
            <title id="title">小毛毛</title>
            <desc id="desc">狗爪与小毛毛文字标志</desc>
            <g fill="currentColor">
              <ellipse cx="37" cy="29" rx="10" ry="14" transform="rotate(-18 37 29)"/>
              <ellipse cx="60" cy="22" rx="10" ry="14"/>
              <ellipse cx="83" cy="29" rx="10" ry="14" transform="rotate(18 83 29)"/>
              <ellipse cx="22" cy="48" rx="9" ry="12" transform="rotate(-35 22 48)"/>
              <path d="M60 43c-19 0-33 14-33 29 0 11 8 17 19 17 6 0 10-3 14-6 4 3 8 6 14 6 11 0 19-6 19-17 0-15-14-29-33-29z"/>
            </g>
            <text x="112" y="64" font-size="40" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" fill="currentColor">小毛毛</text>
          </svg>
          SVG

          rm -f vue3-project/src/assets/imgs/小石榴.png

          if [ -f doc/imgs/小石榴.png ]; then
            mv doc/imgs/小石榴.png doc/imgs/小毛毛.png
          fi

      - name: Verify old branding is gone from text
        shell: bash
        run: |
          set -e
          if grep -RIn --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=dist \
            --include='*.vue' --include='*.js' --include='*.ts' --include='*.json' --include='*.md' \
            --include='*.html' --include='*.sql' --include='*.yml' --include='*.yaml' --include='*.txt' \
            -E '小石榴|石榴号' .; then
            echo 'Old branding still exists in text files.' >&2
            exit 1
          fi

      - name: Commit rebrand
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: rebrand XiaoShiLiu to XiaoMao'
          git push origin HEAD:chore/xiaomao-full-rebrand
