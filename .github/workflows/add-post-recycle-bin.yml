name: Apply post recycle bin feature

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-post-recycle-bin.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply recycle bin implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Backend recycle-bin lifecycle helper
          Path('express-project/utils/postRecycleBin.js').write_text(r'''const fs = require('fs');
          const { pool } = require('../config/config');
          const { extractLocalFilePath, deleteLocalFile } = require('./fileCleanup');
          const { getLocalImageFilename, getThumbnailPath } = require('./imageThumbnail');

          const RECYCLE_STATUS = 4;
          const RECYCLE_RETENTION_DAYS = 30;
          const CLEANUP_INTERVAL_MS = 60 * 60 * 1000;

          function normalizeLocalMediaUrl(url) {
            if (!url || typeof url !== 'string') return null;
            try {
              if (/^https?:\/\//i.test(url)) {
                return new URL(url).pathname;
              }
            } catch (error) {
              return null;
            }
            return url;
          }

          async function cleanupLocalMedia(urls) {
            const uniqueUrls = [...new Set((urls || []).filter(Boolean))];
            for (const url of uniqueUrls) {
              try {
                const localUrl = normalizeLocalMediaUrl(url);
                const filePath = localUrl ? extractLocalFilePath(localUrl) : null;
                if (filePath) {
                  await deleteLocalFile(filePath);
                }

                const imageFilename = getLocalImageFilename(url);
                if (imageFilename) {
                  const thumbnailPath = getThumbnailPath(imageFilename);
                  if (thumbnailPath && fs.existsSync(thumbnailPath)) {
                    await fs.promises.unlink(thumbnailPath).catch(() => {});
                  }
                }
              } catch (error) {
                console.error(`清理回收站媒体失败: ${url}`, error.message);
              }
            }
          }

          async function softDeletePost(postId, { userId = null } = {}) {
            const connection = await pool.getConnection();
            try {
              await connection.beginTransaction();

              let sql = 'SELECT id, user_id, status FROM posts WHERE id = ? AND status <> ? FOR UPDATE';
              const params = [String(postId), String(RECYCLE_STATUS)];
              if (userId !== null && userId !== undefined) {
                sql = 'SELECT id, user_id, status FROM posts WHERE id = ? AND user_id = ? AND status <> ? FOR UPDATE';
                params.splice(1, 0, String(userId));
              }

              const [rows] = await connection.execute(sql, params);
              if (rows.length === 0) {
                await connection.rollback();
                return false;
              }

              const originalStatus = Number(rows[0].status);
              const [tagRows] = await connection.execute(
                'SELECT tag_id FROM post_tags WHERE post_id = ?',
                [String(postId)]
              );

              for (const tag of tagRows) {
                await connection.execute(
                  'UPDATE tags SET use_count = GREATEST(use_count - 1, 0) WHERE id = ?',
                  [String(tag.tag_id)]
                );
              }

              await connection.execute(
                'UPDATE posts SET deleted_status = ?, status = ?, deleted_at = UTC_TIMESTAMP() WHERE id = ?',
                [String(originalStatus), String(RECYCLE_STATUS), String(postId)]
              );

              await connection.commit();
              return true;
            } catch (error) {
              await connection.rollback();
              throw error;
            } finally {
              connection.release();
            }
          }

          async function restorePost(postId, { userId = null } = {}) {
            const connection = await pool.getConnection();
            try {
              await connection.beginTransaction();

              let sql = 'SELECT id, deleted_status FROM posts WHERE id = ? AND status = ? AND deleted_at IS NOT NULL FOR UPDATE';
              const params = [String(postId), String(RECYCLE_STATUS)];
              if (userId !== null && userId !== undefined) {
                sql = 'SELECT id, deleted_status FROM posts WHERE id = ? AND user_id = ? AND status = ? AND deleted_at IS NOT NULL FOR UPDATE';
                params.splice(1, 0, String(userId));
              }

              const [rows] = await connection.execute(sql, params);
              if (rows.length === 0) {
                await connection.rollback();
                return false;
              }

              const previousStatus = Number(rows[0].deleted_status);
              const restoredStatus = [0, 1, 2, 3].includes(previousStatus) ? previousStatus : 1;

              const [tagRows] = await connection.execute(
                'SELECT tag_id FROM post_tags WHERE post_id = ?',
                [String(postId)]
              );
              for (const tag of tagRows) {
                await connection.execute(
                  'UPDATE tags SET use_count = use_count + 1 WHERE id = ?',
                  [String(tag.tag_id)]
                );
              }

              await connection.execute(
                'UPDATE posts SET status = ?, deleted_status = NULL, deleted_at = NULL WHERE id = ?',
                [String(restoredStatus), String(postId)]
              );

              await connection.commit();
              return { restored: true, status: restoredStatus };
            } catch (error) {
              await connection.rollback();
              throw error;
            } finally {
              connection.release();
            }
          }

          async function hardDeletePost(postId, { userId = null } = {}) {
            const connection = await pool.getConnection();
            let mediaUrls = [];
            try {
              await connection.beginTransaction();

              let sql = 'SELECT id FROM posts WHERE id = ? AND status = ? AND deleted_at IS NOT NULL FOR UPDATE';
              const params = [String(postId), String(RECYCLE_STATUS)];
              if (userId !== null && userId !== undefined) {
                sql = 'SELECT id FROM posts WHERE id = ? AND user_id = ? AND status = ? AND deleted_at IS NOT NULL FOR UPDATE';
                params.splice(1, 0, String(userId));
              }

              const [rows] = await connection.execute(sql, params);
              if (rows.length === 0) {
                await connection.rollback();
                return false;
              }

              const [imageRows] = await connection.execute(
                'SELECT image_url FROM post_images WHERE post_id = ?',
                [String(postId)]
              );
              const [videoRows] = await connection.execute(
                'SELECT video_url, cover_url FROM post_videos WHERE post_id = ?',
                [String(postId)]
              );
              mediaUrls = [
                ...imageRows.map(row => row.image_url),
                ...videoRows.flatMap(row => [row.video_url, row.cover_url])
              ].filter(Boolean);

              const [commentRows] = await connection.execute(
                'SELECT id FROM comments WHERE post_id = ?',
                [String(postId)]
              );
              const commentIds = commentRows.map(row => String(row.id));
              if (commentIds.length > 0) {
                const placeholders = commentIds.map(() => '?').join(',');
                await connection.execute(
                  `DELETE FROM likes WHERE target_type = 2 AND target_id IN (${placeholders})`,
                  commentIds
                );
                await connection.execute(
                  `DELETE FROM notifications WHERE comment_id IN (${placeholders})`,
                  commentIds
                );
              }

              await connection.execute(
                'DELETE FROM likes WHERE target_type = 1 AND target_id = ?',
                [String(postId)]
              );
              await connection.execute(
                'DELETE FROM notifications WHERE target_id = ?',
                [String(postId)]
              );
              await connection.execute(
                'DELETE FROM audit WHERE type = 3 AND target_id = ?',
                [String(postId)]
              );

              // post_images/post_videos/post_tags/comments/collections are removed by FK cascade.
              await connection.execute('DELETE FROM posts WHERE id = ?', [String(postId)]);
              await connection.commit();
            } catch (error) {
              await connection.rollback();
              throw error;
            } finally {
              connection.release();
            }

            await cleanupLocalMedia(mediaUrls);
            return true;
          }

          async function purgeExpiredPosts() {
            let deletedCount = 0;
            while (true) {
              const [rows] = await pool.execute(
                `SELECT id FROM posts
                 WHERE status = ?
                   AND deleted_at IS NOT NULL
                   AND deleted_at <= DATE_SUB(UTC_TIMESTAMP(), INTERVAL ${RECYCLE_RETENTION_DAYS} DAY)
                 ORDER BY deleted_at ASC
                 LIMIT 100`,
                [String(RECYCLE_STATUS)]
              );

              if (rows.length === 0) break;
              for (const row of rows) {
                if (await hardDeletePost(row.id)) {
                  deletedCount += 1;
                }
              }
              if (rows.length < 100) break;
            }

            if (deletedCount > 0) {
              console.log(`● 回收站自动清理完成：永久删除 ${deletedCount} 篇过期笔记`);
            }
            return deletedCount;
          }

          function startRecycleBinCleanupService(interval = CLEANUP_INTERVAL_MS) {
            let running = false;
            const run = async () => {
              if (running) return;
              running = true;
              try {
                await purgeExpiredPosts();
              } catch (error) {
                console.error('回收站自动清理失败:', error);
              } finally {
                running = false;
              }
            };

            run();
            const timer = setInterval(run, interval);
            if (typeof timer.unref === 'function') timer.unref();
            console.log(`● 笔记回收站已启用，保留 ${RECYCLE_RETENTION_DAYS} 天，每 ${Math.round(interval / 3600000)} 小时检查一次`);
            return timer;
          }

          module.exports = {
            RECYCLE_STATUS,
            RECYCLE_RETENTION_DAYS,
            softDeletePost,
            restorePost,
            hardDeletePost,
            purgeExpiredPosts,
            startRecycleBinCleanupService
          };
          '''.replace('\n          ', '\n').lstrip())

          # 2) Migration runner: keep old migration and add recycle-bin migration independently
          Path('express-project/scripts/migrate-database.js').write_text(r'''const { pool } = require('../config/config');

          async function columnExists(tableName, columnName) {
            const [rows] = await pool.execute(
              `SELECT COUNT(*) AS count
               FROM INFORMATION_SCHEMA.COLUMNS
               WHERE TABLE_SCHEMA = DATABASE()
                 AND TABLE_NAME = ?
                 AND COLUMN_NAME = ?`,
              [tableName, columnName]
            );
            return Number(rows[0].count) > 0;
          }

          async function indexExists(tableName, indexName) {
            const [rows] = await pool.execute(
              `SELECT COUNT(*) AS count
               FROM INFORMATION_SCHEMA.STATISTICS
               WHERE TABLE_SCHEMA = DATABASE()
                 AND TABLE_NAME = ?
                 AND INDEX_NAME = ?`,
              [tableName, indexName]
            );
            return Number(rows[0].count) > 0;
          }

          async function ensureMigrationTable() {
            await pool.execute(`
              CREATE TABLE IF NOT EXISTS schema_migrations (
                id varchar(100) NOT NULL,
                applied_at timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP,
                PRIMARY KEY (id)
              ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci
            `);
          }

          async function migrationApplied(id) {
            const [rows] = await pool.execute(
              'SELECT id FROM schema_migrations WHERE id = ? LIMIT 1',
              [id]
            );
            return rows.length > 0;
          }

          async function markApplied(id) {
            await pool.execute('INSERT IGNORE INTO schema_migrations (id) VALUES (?)', [id]);
          }

          const migrations = [
            {
              id: '20260903_content_ip_location',
              up: async () => {
                if (!(await columnExists('posts', 'ip_location'))) {
                  console.log('Adding posts.ip_location...');
                  await pool.execute(
                    "ALTER TABLE posts ADD COLUMN ip_location varchar(100) DEFAULT NULL COMMENT '发布时IP属地' AFTER comment_count"
                  );
                }
                if (!(await columnExists('comments', 'ip_location'))) {
                  console.log('Adding comments.ip_location...');
                  await pool.execute(
                    "ALTER TABLE comments ADD COLUMN ip_location varchar(100) DEFAULT NULL COMMENT '评论时IP属地' AFTER like_count"
                  );
                }
              }
            },
            {
              id: '20260911_post_recycle_bin',
              up: async () => {
                if (!(await columnExists('posts', 'deleted_status'))) {
                  console.log('Adding posts.deleted_status...');
                  await pool.execute(
                    "ALTER TABLE posts ADD COLUMN deleted_status tinyint(1) DEFAULT NULL COMMENT '移入回收站前的状态' AFTER status"
                  );
                }
                if (!(await columnExists('posts', 'deleted_at'))) {
                  console.log('Adding posts.deleted_at...');
                  await pool.execute(
                    "ALTER TABLE posts ADD COLUMN deleted_at timestamp NULL DEFAULT NULL COMMENT '移入回收站时间' AFTER deleted_status"
                  );
                }
                if (!(await indexExists('posts', 'idx_deleted_at'))) {
                  console.log('Adding idx_deleted_at...');
                  await pool.execute('ALTER TABLE posts ADD KEY idx_deleted_at (deleted_at)');
                }
              }
            }
          ];

          async function main() {
            try {
              await ensureMigrationTable();
              for (const migration of migrations) {
                if (await migrationApplied(migration.id)) {
                  console.log(`Migration already applied: ${migration.id}`);
                  continue;
                }
                await migration.up();
                await markApplied(migration.id);
                console.log(`Migration applied: ${migration.id}`);
              }
            } finally {
              await pool.end();
            }
          }

          main().catch(error => {
            console.error('Database migration failed:', error);
            process.exit(1);
          });
          '''.replace('\n          ', '\n').lstrip())

          # 3) Fresh-install schema
          replace_once(
              'express-project/scripts/init-database.sql',
              "  `status` tinyint(1) DEFAULT 2 COMMENT '笔记状态：0-发布（审核通过），1-草稿，2-待审核',\n",
              "  `status` tinyint(1) DEFAULT 2 COMMENT '笔记状态：0-发布，1-草稿，2-待审核，3-未过审，4-回收站',\n"
              "  `deleted_status` tinyint(1) DEFAULT NULL COMMENT '移入回收站前的状态',\n"
              "  `deleted_at` timestamp NULL DEFAULT NULL COMMENT '移入回收站时间',\n"
          )
          replace_once(
              'express-project/scripts/init-database.sql',
              "  KEY `idx_created_at` (`created_at`),\n  KEY `idx_like_count` (`like_count`),\n",
              "  KEY `idx_created_at` (`created_at`),\n  KEY `idx_deleted_at` (`deleted_at`),\n  KEY `idx_like_count` (`like_count`),\n"
          )

          # 4) Start cleanup service with the backend
          replace_once(
              'express-project/app.js',
              "const { startAutoUnbanService } = require('./utils/autoUnban');\n",
              "const { startAutoUnbanService } = require('./utils/autoUnban');\nconst { startRecycleBinCleanupService } = require('./utils/postRecycleBin');\n"
          )
          replace_once(
              'express-project/app.js',
              "// 启动自动解封服务\nstartAutoUnbanService();\n",
              "// 启动自动解封服务\nstartAutoUnbanService();\n\n// 启动笔记回收站过期清理服务\nstartRecycleBinCleanupService();\n"
          )

          # 5) User-facing recycle-bin API and soft-delete behavior
          replace_once(
              'express-project/routes/posts.js',
              "const { resolvePostStatus, queuePostAudit } = require('../utils/reviewPolicy');\n",
              "const { resolvePostStatus, queuePostAudit } = require('../utils/reviewPolicy');\n"
              "const { RECYCLE_STATUS, RECYCLE_RETENTION_DAYS, softDeletePost, restorePost, hardDeletePost } = require('../utils/postRecycleBin');\n"
          )

          posts_path = Path('express-project/routes/posts.js')
          posts_text = posts_path.read_text()
          detail_marker = '// 获取笔记详情\n'
          if detail_marker not in posts_text:
              raise SystemExit('post detail marker not found')
          recycle_routes = r'''// 获取当前用户的回收站
          router.get('/recycle-bin', authenticateToken, async (req, res) => {
            try {
              const userId = req.user.id;
              const page = Math.max(1, parseInt(req.query.page) || 1);
              const limit = Math.min(50, Math.max(1, parseInt(req.query.limit) || 10));
              const offset = (page - 1) * limit;

              const [rows] = await pool.execute(
                `SELECT p.*, c.name AS category,
                        DATE_ADD(p.deleted_at, INTERVAL ${RECYCLE_RETENTION_DAYS} DAY) AS expires_at,
                        GREATEST(0, CEIL(TIMESTAMPDIFF(SECOND, UTC_TIMESTAMP(), DATE_ADD(p.deleted_at, INTERVAL ${RECYCLE_RETENTION_DAYS} DAY)) / 86400)) AS remaining_days
                 FROM posts p
                 LEFT JOIN categories c ON p.category_id = c.id
                 WHERE p.user_id = ? AND p.status = ? AND p.deleted_at IS NOT NULL
                 ORDER BY p.deleted_at DESC
                 LIMIT ? OFFSET ?`,
                [String(userId), String(RECYCLE_STATUS), String(limit), String(offset)]
              );

              if (rows.length > 0) {
                const postIds = rows.map(row => row.id);
                const [images] = await pool.query(
                  'SELECT post_id, image_url FROM post_images WHERE post_id IN (?)',
                  [postIds]
                );
                const [videos] = await pool.query(
                  'SELECT post_id, video_url, cover_url FROM post_videos WHERE post_id IN (?)',
                  [postIds]
                );
                const imageMap = {};
                const videoMap = {};
                images.forEach(image => {
                  if (!imageMap[image.post_id]) imageMap[image.post_id] = [];
                  imageMap[image.post_id].push(image.image_url);
                });
                videos.forEach(video => { videoMap[video.post_id] = video; });

                rows.forEach(post => {
                  if (post.type === 2) {
                    const video = videoMap[post.id];
                    post.video_url = video?.video_url || null;
                    post.cover_url = video?.cover_url || null;
                    post.images = post.cover_url ? [post.cover_url] : [];
                  } else {
                    post.images = imageMap[post.id] || [];
                  }
                });
              }

              const [countRows] = await pool.execute(
                'SELECT COUNT(*) AS total FROM posts WHERE user_id = ? AND status = ? AND deleted_at IS NOT NULL',
                [String(userId), String(RECYCLE_STATUS)]
              );
              const total = Number(countRows[0].total) || 0;

              res.json({
                code: RESPONSE_CODES.SUCCESS,
                success: true,
                message: 'success',
                data: {
                  posts: rows,
                  retention_days: RECYCLE_RETENTION_DAYS,
                  pagination: { page, limit, total, pages: Math.ceil(total / limit) }
                }
              });
            } catch (error) {
              console.error('获取回收站失败:', error);
              res.status(HTTP_STATUS.INTERNAL_SERVER_ERROR).json({ code: RESPONSE_CODES.ERROR, message: ERROR_MESSAGES.INTERNAL_SERVER_ERROR });
            }
          });

          // 恢复回收站笔记到删除前状态
          router.post('/:id/restore', authenticateToken, async (req, res) => {
            try {
              const result = await restorePost(req.params.id, { userId: req.user.id });
              if (!result) {
                return res.status(HTTP_STATUS.NOT_FOUND).json({ code: RESPONSE_CODES.NOT_FOUND, message: '回收站中未找到此笔记' });
              }
              res.json({
                code: RESPONSE_CODES.SUCCESS,
                success: true,
                message: '恢复成功',
                data: { id: req.params.id, status: result.status }
              });
            } catch (error) {
              console.error('恢复笔记失败:', error);
              res.status(HTTP_STATUS.INTERNAL_SERVER_ERROR).json({ code: RESPONSE_CODES.ERROR, message: ERROR_MESSAGES.INTERNAL_SERVER_ERROR });
            }
          });

          // 用户主动永久删除回收站笔记
          router.delete('/:id/permanent', authenticateToken, async (req, res) => {
            try {
              const deleted = await hardDeletePost(req.params.id, { userId: req.user.id });
              if (!deleted) {
                return res.status(HTTP_STATUS.NOT_FOUND).json({ code: RESPONSE_CODES.NOT_FOUND, message: '回收站中未找到此笔记' });
              }
              res.json({ code: RESPONSE_CODES.SUCCESS, success: true, message: '已永久删除' });
            } catch (error) {
              console.error('永久删除笔记失败:', error);
              res.status(HTTP_STATUS.INTERNAL_SERVER_ERROR).json({ code: RESPONSE_CODES.ERROR, message: ERROR_MESSAGES.INTERNAL_SERVER_ERROR });
            }
          });

          '''.replace('\n          ', '\n')
          posts_text = posts_text.replace(detail_marker, recycle_routes + detail_marker, 1)

          # Recycled content cannot be opened through the normal detail endpoint, even by its author.
          old_detail_guard = "    const post = rows[0];\n\n    // 检查笔记状态权限\n"
          new_detail_guard = "    const post = rows[0];\n\n    if (Number(post.status) === RECYCLE_STATUS || post.deleted_at) {\n      return res.status(HTTP_STATUS.NOT_FOUND).json({ code: RESPONSE_CODES.NOT_FOUND, message: '笔记不存在' });\n    }\n\n    // 检查笔记状态权限\n"
          if old_detail_guard not in posts_text:
              raise SystemExit('detail guard marker not found')
          posts_text = posts_text.replace(old_detail_guard, new_detail_guard, 1)

          old_update_lookup = "      'SELECT user_id, type FROM posts WHERE id = ?',\n      [postId.toString()]\n"
          new_update_lookup = "      'SELECT user_id, type FROM posts WHERE id = ? AND status <> ?',\n      [postId.toString(), String(RECYCLE_STATUS)]\n"
          if old_update_lookup not in posts_text:
              raise SystemExit('update lookup marker not found')
          posts_text = posts_text.replace(old_update_lookup, new_update_lookup, 1)

          delete_start = posts_text.find("// 删除笔记\nrouter.delete('/:id', authenticateToken")
          delete_end = posts_text.find("// 取消收藏笔记\n", delete_start)
          if delete_start < 0 or delete_end < 0:
              raise SystemExit('delete route markers not found')
          soft_delete_route = r'''// 删除笔记：移入回收站，30天后再物理清理
          router.delete('/:id', authenticateToken, async (req, res) => {
            try {
              const moved = await softDeletePost(req.params.id, { userId: req.user.id });
              if (!moved) {
                return res.status(HTTP_STATUS.NOT_FOUND).json({ code: RESPONSE_CODES.NOT_FOUND, message: '笔记不存在或已在回收站' });
              }

              res.json({
                code: RESPONSE_CODES.SUCCESS,
                success: true,
                message: `已移入回收站，${RECYCLE_RETENTION_DAYS}天后自动删除`
              });
            } catch (error) {
              console.error('移入回收站失败:', error);
              res.status(HTTP_STATUS.INTERNAL_SERVER_ERROR).json({ code: RESPONSE_CODES.ERROR, message: ERROR_MESSAGES.INTERNAL_SERVER_ERROR });
            }
          });

          '''.replace('\n          ', '\n')
          posts_text = posts_text[:delete_start] + soft_delete_route + posts_text[delete_end:]
          posts_path.write_text(posts_text)

          # 6) Admin delete also means recycle-bin soft delete; hide recycled rows from normal post management
          replace_once(
              'express-project/routes/admin.js',
              "const NotificationHelper = require('../utils/notificationHelper')\n",
              "const NotificationHelper = require('../utils/notificationHelper')\nconst { softDeletePost, RECYCLE_RETENTION_DAYS } = require('../utils/postRecycleBin')\n"
          )
          replace_once(
              'express-project/routes/admin.js',
              "      // 搜索条件\n      let whereClause = ''\n      const params = []\n\n      if (req.query.title) {\n",
              "      // 搜索条件：普通笔记管理不展示回收站内容\n      let whereClause = 'WHERE p.status <> 4'\n      const params = []\n\n      if (req.query.title) {\n"
          )

          admin_path = Path('express-project/routes/admin.js')
          admin_text = admin_path.read_text()
          handlers_marker = "const postsHandlers = createCrudHandlers(postsCrudConfig)\n"
          if handlers_marker not in admin_text:
              raise SystemExit('postsHandlers marker not found')
          admin_soft_handlers = r'''const adminSoftDeletePost = async (req, res) => {
            try {
              const moved = await softDeletePost(req.params.id);
              if (!moved) {
                return res.status(HTTP_STATUS.NOT_FOUND).json({ code: RESPONSE_CODES.NOT_FOUND, message: '笔记不存在或已在回收站' });
              }
              res.json({ code: RESPONSE_CODES.SUCCESS, success: true, message: `已移入回收站，${RECYCLE_RETENTION_DAYS}天后自动删除` });
            } catch (error) {
              console.error('管理员移入回收站失败:', error);
              res.status(HTTP_STATUS.INTERNAL_SERVER_ERROR).json({ code: RESPONSE_CODES.ERROR, message: '删除笔记失败' });
            }
          };

          const adminSoftDeletePosts = async (req, res) => {
            try {
              const ids = Array.isArray(req.body?.ids) ? req.body.ids : [];
              if (ids.length === 0) {
                return res.status(HTTP_STATUS.BAD_REQUEST).json({ code: RESPONSE_CODES.VALIDATION_ERROR, message: '请选择要删除的笔记' });
              }
              let movedCount = 0;
              for (const id of ids) {
                if (await softDeletePost(id)) movedCount += 1;
              }
              res.json({
                code: RESPONSE_CODES.SUCCESS,
                success: true,
                message: `已将${movedCount}篇笔记移入回收站`,
                data: { deletedCount: movedCount }
              });
            } catch (error) {
              console.error('管理员批量移入回收站失败:', error);
              res.status(HTTP_STATUS.INTERNAL_SERVER_ERROR).json({ code: RESPONSE_CODES.ERROR, message: '批量删除笔记失败' });
            }
          };

          '''.replace('\n          ', '\n')
          admin_text = admin_text.replace(handlers_marker, admin_soft_handlers + handlers_marker, 1)
          admin_text = admin_text.replace("router.delete('/posts-audit', adminAuth, postsHandlers.deleteMany)", "router.delete('/posts-audit', adminAuth, adminSoftDeletePosts)")
          admin_text = admin_text.replace("router.delete('/posts/:id', adminAuth, postsHandlers.deleteOne)", "router.delete('/posts/:id', adminAuth, adminSoftDeletePost)")
          admin_text = admin_text.replace("router.delete('/posts', adminAuth, postsHandlers.deleteMany)", "router.delete('/posts', adminAuth, adminSoftDeletePosts)")
          admin_path.write_text(admin_text)

          # 7) Frontend post API helpers
          replace_once(
              'vue3-project/src/api/posts.js',
              "    // 笔记状态：0-已发布，1-草稿，2-待审核\n    status: backendPost.status\n",
              "    // 笔记状态：0-已发布，1-草稿，2-待审核，3-未过审，4-回收站\n    status: backendPost.status,\n    deleted_status: backendPost.deleted_status,\n    deleted_at: backendPost.deleted_at,\n    expires_at: backendPost.expires_at,\n    remaining_days: backendPost.remaining_days\n"
          )
          api_path = Path('vue3-project/src/api/posts.js')
          api_text = api_path.read_text()
          draft_marker = '// 获取草稿列表\n'
          if draft_marker not in api_text:
              raise SystemExit('draft API marker not found')
          recycle_api = r'''// 获取回收站笔记
          export async function getRecycleBinPosts(params = {}) {
            try {
              const response = await request.get('/posts/recycle-bin', {
                params: {
                  page: params.page || 1,
                  limit: params.limit || 10
                }
              })
              const payload = response.data || response
              const posts = payload.posts || []
              return {
                success: true,
                data: {
                  posts: posts.map(transformPostData),
                  retention_days: payload.retention_days || 30,
                  pagination: payload.pagination || { page: 1, pages: 1, total: 0 }
                }
              }
            } catch (error) {
              console.error('获取回收站失败:', error)
              return { success: false, message: error.response?.data?.message || '获取回收站失败' }
            }
          }

          export async function restorePost(postId) {
            try {
              const response = await request.post(`/posts/${postId}/restore`)
              return { success: response.success !== false, data: response.data, message: response.message || '恢复成功' }
            } catch (error) {
              return { success: false, message: error.response?.data?.message || '恢复失败' }
            }
          }

          export async function permanentlyDeletePost(postId) {
            try {
              const response = await request.delete(`/posts/${postId}/permanent`)
              return { success: response.success !== false, message: response.message || '已永久删除' }
            } catch (error) {
              return { success: false, message: error.response?.data?.message || '永久删除失败' }
            }
          }

          '''.replace('\n          ', '\n')
          api_path.write_text(api_text.replace(draft_marker, recycle_api + draft_marker, 1))

          # 8) User recycle-bin page
          Path('vue3-project/src/views/recycle-bin/index.vue').parent.mkdir(parents=True, exist_ok=True)
          Path('vue3-project/src/views/recycle-bin/index.vue').write_text(r'''<template>
            <div class="recycle-container">
              <div class="page-header">
                <div class="header-left">
                  <button class="back-btn" @click="router.push('/post-management')">
                    <SvgIcon name="left" width="20" height="20" />
                  </button>
                  <div>
                    <h1 class="page-title">回收站</h1>
                    <p class="page-subtitle">删除的笔记保留 {{ retentionDays }} 天，过期后自动永久删除</p>
                  </div>
                </div>
                <span class="post-count">共 {{ total }} 篇</span>
              </div>

              <div v-if="loading" class="state">加载中...</div>
              <div v-else-if="posts.length === 0" class="state empty-state">
                <SvgIcon name="empty" width="72" height="72" />
                <p>回收站是空的</p>
              </div>

              <div v-else class="recycle-list">
                <article v-for="post in posts" :key="post.id" class="recycle-card">
                  <div class="thumb">
                    <img v-if="getCover(post)" :src="getCover(post)" :alt="post.title" @error="handleImageError" />
                    <div v-else class="placeholder">{{ post.type === 2 ? '视频' : '图文' }}</div>
                  </div>

                  <div class="post-info">
                    <h3>{{ post.title || '未命名笔记' }}</h3>
                    <p class="content">{{ plainText(post.content) }}</p>
                    <div class="meta">
                      <span>删除前：{{ getStatusText(post.deleted_status) }}</span>
                      <span>删除于 {{ formatDate(post.deleted_at) }}</span>
                      <span class="expire">{{ getRemainingText(post) }}</span>
                    </div>
                  </div>

                  <div class="actions">
                    <button class="restore-btn" @click="handleRestore(post)">恢复</button>
                    <button class="delete-btn" @click="confirmPermanentDelete(post)">彻底删除</button>
                  </div>
                </article>
              </div>

              <div v-if="pages > 1" class="pagination">
                <button :disabled="page <= 1" @click="changePage(page - 1)">上一页</button>
                <span>{{ page }} / {{ pages }}</span>
                <button :disabled="page >= pages" @click="changePage(page + 1)">下一页</button>
              </div>

              <ConfirmDialog
                v-model:visible="showPermanentDelete"
                title="彻底删除"
                :message="`确定要永久删除《${selectedPost?.title || '这篇笔记'}》吗？图片、视频和相关数据将立即清理，且无法恢复。`"
                type="warning"
                confirm-text="彻底删除"
                cancel-text="取消"
                @confirm="handlePermanentDelete"
                @cancel="showPermanentDelete = false"
              />
              <MessageToast v-if="toastMessage" :message="toastMessage" :type="toastType" @close="toastMessage = ''" />
            </div>
          </template>

          <script setup>
          import { ref, onMounted } from 'vue'
          import { useRouter } from 'vue-router'
          import { getRecycleBinPosts, restorePost, permanentlyDeletePost } from '@/api/posts'
          import SvgIcon from '@/components/SvgIcon.vue'
          import ConfirmDialog from '@/components/ConfirmDialog.vue'
          import MessageToast from '@/components/MessageToast.vue'
          import defaultPlaceholder from '@/assets/imgs/未加载.png'

          const router = useRouter()
          const posts = ref([])
          const loading = ref(false)
          const page = ref(1)
          const pages = ref(1)
          const total = ref(0)
          const retentionDays = ref(30)
          const selectedPost = ref(null)
          const showPermanentDelete = ref(false)
          const toastMessage = ref('')
          const toastType = ref('success')

          const showMessage = (message, type = 'success') => {
            toastMessage.value = message
            toastType.value = type
          }

          const loadPosts = async () => {
            loading.value = true
            try {
              const result = await getRecycleBinPosts({ page: page.value, limit: 10 })
              if (!result.success) {
                showMessage(result.message || '加载失败', 'error')
                return
              }
              posts.value = result.data.posts
              retentionDays.value = result.data.retention_days || 30
              total.value = result.data.pagination.total || 0
              pages.value = result.data.pagination.pages || 1
            } finally {
              loading.value = false
            }
          }

          const changePage = value => {
            page.value = value
            loadPosts()
          }

          const getCover = post => post.thumbnail_cover_url || post.thumbnail_image || post.cover_url || post.images?.[0] || ''
          const handleImageError = event => { event.target.src = defaultPlaceholder }
          const plainText = value => String(value || '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120)
          const formatDate = value => value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '-'
          const getStatusText = status => ({ 0: '已发布', 1: '草稿', 2: '待审核', 3: '未过审' }[Number(status)] || '笔记')
          const getRemainingText = post => {
            const days = Math.max(0, Number(post.remaining_days ?? retentionDays.value))
            return days === 0 ? '即将自动清理' : `剩余 ${days} 天`
          }

          const handleRestore = async post => {
            const result = await restorePost(post.id)
            if (result.success) {
              showMessage('已恢复到删除前状态')
              await loadPosts()
            } else {
              showMessage(result.message || '恢复失败', 'error')
            }
          }

          const confirmPermanentDelete = post => {
            selectedPost.value = post
            showPermanentDelete.value = true
          }

          const handlePermanentDelete = async () => {
            if (!selectedPost.value) return
            const result = await permanentlyDeletePost(selectedPost.value.id)
            if (result.success) {
              showPermanentDelete.value = false
              selectedPost.value = null
              showMessage('已永久删除')
              if (posts.value.length === 1 && page.value > 1) page.value -= 1
              await loadPosts()
            } else {
              showMessage(result.message || '永久删除失败', 'error')
            }
          }

          onMounted(loadPosts)
          </script>

          <style scoped>
          .recycle-container { min-height: 100vh; max-width: 760px; min-width: 700px; margin: 72px auto; padding-bottom: 48px; color: var(--text-color-primary); }
          .page-header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; background: var(--bg-color-primary); border-bottom: 1px solid var(--border-color-primary); }
          .header-left { display: flex; align-items: center; gap: 12px; }
          .back-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--text-color-primary); cursor: pointer; }
          .back-btn:hover { background: var(--bg-color-secondary); }
          .page-title { margin: 0; font-size: 1.2rem; }
          .page-subtitle { margin: 4px 0 0; font-size: 12px; color: var(--text-color-secondary); }
          .post-count { font-size: 13px; color: var(--text-color-secondary); white-space: nowrap; }
          .state { padding: 64px 16px; text-align: center; color: var(--text-color-secondary); }
          .empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; }
          .recycle-list { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
          .recycle-card { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--border-color-primary); border-radius: 10px; background: var(--bg-color-primary); }
          .thumb { width: 82px; height: 82px; flex: 0 0 82px; border-radius: 8px; overflow: hidden; background: var(--bg-color-secondary); }
          .thumb img { width: 100%; height: 100%; object-fit: cover; }
          .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-color-secondary); }
          .post-info { min-width: 0; flex: 1; }
          .post-info h3 { margin: 0 0 6px; font-size: 15px; }
          .content { margin: 0 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--text-color-secondary); }
          .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--text-color-secondary); }
          .expire { color: var(--primary-color); }
          .actions { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }
          .actions button { min-width: 76px; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
          .restore-btn { border: 0; background: var(--primary-color); color: #fff; }
          .delete-btn { border: 1px solid var(--border-color-primary); background: transparent; color: var(--text-color-primary); }
          .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
          .pagination button { padding: 7px 12px; border: 1px solid var(--border-color-primary); border-radius: 6px; background: var(--bg-color-primary); color: var(--text-color-primary); cursor: pointer; }
          .pagination button:disabled { opacity: .45; cursor: not-allowed; }
          @media (max-width: 960px) {
            .recycle-container { min-width: 0; width: 100%; margin: 0; padding-top: 72px; }
            .recycle-card { align-items: flex-start; }
            .thumb { width: 64px; height: 64px; flex-basis: 64px; }
            .actions { flex-direction: row; position: absolute; right: 30px; margin-top: 74px; }
            .recycle-card { position: relative; padding-bottom: 52px; }
            .page-subtitle { max-width: 230px; }
          }
          </style>
          '''.replace('\n          ', '\n').lstrip())

          # 9) Router entry
          replace_once(
              'vue3-project/src/router/index.js',
              "import DraftBoxPage from '@/views/draft-box/index.vue'\n",
              "import DraftBoxPage from '@/views/draft-box/index.vue'\nimport RecycleBinPage from '@/views/recycle-bin/index.vue'\n"
          )
          replace_once(
              'vue3-project/src/router/index.js',
              "        {\n          path: 'draft-box',\n          name: 'draft_box',\n          component: DraftBoxPage\n        },\n",
              "        {\n          path: 'draft-box',\n          name: 'draft_box',\n          component: DraftBoxPage\n        },\n        {\n          path: 'recycle-bin',\n          name: 'recycle_bin',\n          component: RecycleBinPage\n        },\n"
          )

          # 10) Post-management UX
          replace_once(
              'vue3-project/src/views/post-management/index.vue',
              "      <div class=\"header-right\">\n        <span class=\"post-count\">共 {{ totalPosts }} 篇笔记</span>\n      </div>\n",
              "      <div class=\"header-right\">\n        <button class=\"recycle-bin-btn\" @click=\"goToRecycleBin\">\n          <SvgIcon name=\"delete\" width=\"15\" height=\"15\" />\n          回收站\n        </button>\n        <span class=\"post-count\">共 {{ totalPosts }} 篇笔记</span>\n      </div>\n"
          )
          replace_once(
              'vue3-project/src/views/post-management/index.vue',
              ":message=\"`确定要删除笔记《${selectedPost?.title}》吗？此操作不可撤销。`\"",
              ":message=\"`确定要删除笔记《${selectedPost?.title}》吗？删除后将进入回收站并保留30天，在此期间可以恢复。`\""
          )
          replace_once(
              'vue3-project/src/views/post-management/index.vue',
              "const goToPublish = () => {\n  router.push('/publish')\n}\n",
              "const goToPublish = () => {\n  router.push('/publish')\n}\n\nconst goToRecycleBin = () => {\n  router.push('/recycle-bin')\n}\n"
          )
          replace_once(
              'vue3-project/src/views/post-management/index.vue',
              "      showMessage('删除成功', 'success')\n",
              "      showMessage('已移入回收站', 'success')\n"
          )
          replace_once(
              'vue3-project/src/views/post-management/index.vue',
              ".header-right {\n  display: flex;\n  align-items: center;\n}\n",
              ".header-right {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.recycle-bin-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  padding: 7px 10px;\n  border: 1px solid var(--border-color-primary);\n  border-radius: 6px;\n  background: var(--bg-color-primary);\n  color: var(--text-color-primary);\n  cursor: pointer;\n}\n\n.recycle-bin-btn:hover {\n  background: var(--bg-color-secondary);\n}\n"
          )

          # 11) Draft deletions also go to the same recycle bin
          replace_once(
              'vue3-project/src/views/draft-box/index.vue',
              "message=\"确定要删除这篇草稿吗？删除后无法恢复。\"",
              "message=\"确定要删除这篇草稿吗？删除后将进入回收站并保留30天，在此期间可以恢复。\""
          )
          replace_once(
              'vue3-project/src/views/draft-box/index.vue',
              "      showMessage('删除成功', 'success')\n",
              "      showMessage('已移入回收站', 'success')\n"
          )

          # 12) Audit-page wording must match soft-delete semantics
          post_audit = Path('vue3-project/src/views/admin/PostAudit.vue')
          audit_text = post_audit.read_text()
          audit_text = audit_text.replace(
              "》吗？此操作不可撤销。`\" type=\"warning\"",
              "》吗？删除后将进入该用户的回收站并保留30天。`\" type=\"warning\""
          )
          post_audit.write_text(audit_text)
          PY

      - name: Validate backend syntax
        run: |
          node --check express-project/app.js
          node --check express-project/routes/posts.js
          node --check express-project/routes/admin.js
          node --check express-project/utils/postRecycleBin.js
          node --check express-project/scripts/migrate-database.js

      - name: Build frontend
        working-directory: vue3-project
        run: |
          npm ci
          npm run build

      - name: Validate recycle-bin wiring
        run: |
          grep -q "router.get('/recycle-bin'" express-project/routes/posts.js
          grep -q "router.post('/:id/restore'" express-project/routes/posts.js
          grep -q "router.delete('/:id/permanent'" express-project/routes/posts.js
          grep -q "startRecycleBinCleanupService" express-project/app.js
          grep -q "20260911_post_recycle_bin" express-project/scripts/migrate-database.js
          grep -q "path: 'recycle-bin'" vue3-project/src/router/index.js

      - name: Commit feature and remove temporary workflow
        run: |
          rm .github/workflows/add-post-recycle-bin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add 30-day post recycle bin"
          git push origin main
