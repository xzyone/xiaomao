name: Apply content-level IP location

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-content-location.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch content location model
        run: |
          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_all(text, old, new, label, minimum=1):
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{label}: expected at least {minimum} matches, found {count}')
              return text.replace(old, new)

          # posts.js: content location is captured when submitted/published, not while saving a draft.
          path = 'express-project/routes/posts.js'
          text = load(path)
          text = replace_once(
              text,
              "const { sanitizeContent } = require('../utils/contentSecurity');\n",
              "const { sanitizeContent } = require('../utils/contentSecurity');\nconst { getContentLocation } = require('../utils/contentLocation');\n",
              'posts import'
          )
          text = replace_all(
              text,
              'u.location, u.verified',
              'p.ip_location as location, u.verified',
              'posts location selects'
          )
          text = replace_all(
              text,
              'u.location as user_location, u.verified',
              'c.ip_location as user_location, u.verified',
              'posts comment location select'
          )
          text = replace_once(
              text,
              "    // 插入笔记\n    console.log('📝 开始插入笔记到数据库...');\n    const [result] = await pool.execute(\n      'INSERT INTO posts (user_id, title, content, category_id, status, type) VALUES (?, ?, ?, ?, ?, ?)',\n      [userId, title || '', sanitizedContent, category_id || null, (status !== undefined ? status : 2).toString(), postType]\n    );",
              "    // 草稿不记录属地；首次提交/发布时固化当次请求的IP属地\n    const ipLocation = String(status) === '1' ? null : await getContentLocation(req);\n\n    // 插入笔记\n    console.log('📝 开始插入笔记到数据库...');\n    const [result] = await pool.execute(\n      'INSERT INTO posts (user_id, title, content, category_id, status, type, ip_location) VALUES (?, ?, ?, ?, ?, ?, ?)',\n      [userId, title || '', sanitizedContent, category_id || null, (status !== undefined ? status : 2).toString(), postType, ipLocation]\n    );",
              'posts create insert'
          )
          text = replace_once(
              text,
              "    const [originalPostRows] = await pool.execute('SELECT status, content FROM posts WHERE id = ?', [postId.toString()]);\n    const wasOriginallyDraft = originalPostRows.length > 0 && originalPostRows[0].status === 1;\n    const originalContent = originalPostRows.length > 0 ? originalPostRows[0].content : '';\n\n    // 更新笔记基本信息\n    await pool.execute(\n      'UPDATE posts SET title = ?, content = ?, category_id = ?, status = ? WHERE id = ?',\n      [title || '', sanitizedContent, category_id || null, (status !== undefined ? status : 2).toString(), postId.toString()]\n    );",
              "    const [originalPostRows] = await pool.execute('SELECT status, content, ip_location FROM posts WHERE id = ?', [postId.toString()]);\n    const wasOriginallyDraft = originalPostRows.length > 0 && originalPostRows[0].status === 1;\n    const originalContent = originalPostRows.length > 0 ? originalPostRows[0].content : '';\n    let ipLocation = originalPostRows.length > 0 ? originalPostRows[0].ip_location : null;\n\n    // 只有草稿首次提交时记录发布属地；已提交内容后续编辑不改变历史属地\n    if (wasOriginallyDraft && String(status) !== '1') {\n      ipLocation = await getContentLocation(req);\n    }\n\n    // 更新笔记基本信息\n    await pool.execute(\n      'UPDATE posts SET title = ?, content = ?, category_id = ?, status = ?, ip_location = ? WHERE id = ?',\n      [title || '', sanitizedContent, category_id || null, (status !== undefined ? status : 2).toString(), ipLocation, postId.toString()]\n    );",
              'posts draft publish transition'
          )
          save(path, text)

          # comments.js: every new comment/reply gets its own immutable creation location.
          path = 'express-project/routes/comments.js'
          text = load(path)
          text = replace_once(
              text,
              "const { sanitizeContent } = require('../utils/contentSecurity');\n",
              "const { sanitizeContent } = require('../utils/contentSecurity');\nconst { getContentLocation } = require('../utils/contentLocation');\n",
              'comments import'
          )
          text = replace_all(
              text,
              'u.location as user_location, u.verified',
              'c.ip_location as user_location, u.verified',
              'comments location selects'
          )
          text = replace_once(
              text,
              "    // 插入评论\n    const [result] = await pool.execute(\n      'INSERT INTO comments (post_id, user_id, content, parent_id) VALUES (?, ?, ?, ?)',\n      [post_id.toString(), userId.toString(), sanitizedContent, parent_id ? parent_id.toString() : null]\n    );",
              "    // 固化评论/回复发送时的IP属地；查询失败时留空，不阻塞评论\n    const ipLocation = await getContentLocation(req);\n\n    // 插入评论\n    const [result] = await pool.execute(\n      'INSERT INTO comments (post_id, user_id, content, parent_id, ip_location) VALUES (?, ?, ?, ?, ?)',\n      [post_id.toString(), userId.toString(), sanitizedContent, parent_id ? parent_id.toString() : null, ipLocation]\n    );",
              'comments create insert'
          )
          save(path, text)

          # Search results must expose the post snapshot, not the author's latest login location.
          path = 'express-project/routes/search.js'
          text = load(path)
          text = replace_once(
              text,
              'SELECT p.*, u.nickname, u.avatar as user_avatar, u.user_id as author_account, u.location\n',
              'SELECT p.*, u.nickname, u.avatar as user_avatar, u.user_id as author_account, p.ip_location as location\n',
              'search post location'
          )
          save(path, text)

          # User post/collection/like feeds also use the post snapshot. User profile location stays unchanged.
          path = 'express-project/routes/users.js'
          text = load(path)
          text = replace_all(
              text,
              'SELECT p.*, u.nickname, u.avatar as user_avatar, u.user_id as author_account, u.location,',
              'SELECT p.*, u.nickname, u.avatar as user_avatar, u.user_id as author_account, p.ip_location as location,',
              'users post location selects',
              minimum=3
          )
          save(path, text)

          # Fresh database schema (SQL initializer).
          path = 'express-project/scripts/init-database.sql'
          text = load(path)
          text = replace_once(
              text,
              "  `comment_count` int(11) DEFAULT 0 COMMENT '评论数',\n  `created_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '发布时间',",
              "  `comment_count` int(11) DEFAULT 0 COMMENT '评论数',\n  `ip_location` varchar(100) DEFAULT NULL COMMENT '发布时IP属地',\n  `created_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '发布时间',",
              'sql posts ip_location'
          )
          text = replace_once(
              text,
              "  `like_count` int(11) DEFAULT 0 COMMENT '点赞数',\n  `created_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '评论时间',",
              "  `like_count` int(11) DEFAULT 0 COMMENT '点赞数',\n  `ip_location` varchar(100) DEFAULT NULL COMMENT '评论时IP属地',\n  `created_at` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '评论时间',",
              'sql comments ip_location'
          )
          save(path, text)

          # Fresh database schema (Node initializer).
          path = 'express-project/scripts/init-database.js'
          text = load(path)
          text = replace_once(
              text,
              "        \\`comment_count\\` int(11) DEFAULT 0 COMMENT '评论数',\n        \\`created_at\\` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '发布时间',",
              "        \\`comment_count\\` int(11) DEFAULT 0 COMMENT '评论数',\n        \\`ip_location\\` varchar(100) DEFAULT NULL COMMENT '发布时IP属地',\n        \\`created_at\\` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '发布时间',",
              'js initializer posts ip_location'
          )
          text = replace_once(
              text,
              "        \\`like_count\\` int(11) DEFAULT 0 COMMENT '点赞数',\n        \\`created_at\\` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '评论时间',",
              "        \\`like_count\\` int(11) DEFAULT 0 COMMENT '点赞数',\n        \\`ip_location\\` varchar(100) DEFAULT NULL COMMENT '评论时IP属地',\n        \\`created_at\\` timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP COMMENT '评论时间',",
              'js initializer comments ip_location'
          )
          save(path, text)
          PY

      - name: Validate backend syntax and patches
        run: |
          node --check express-project/routes/posts.js
          node --check express-project/routes/comments.js
          node --check express-project/routes/search.js
          node --check express-project/routes/users.js
          node --check express-project/utils/contentLocation.js
          node --check express-project/scripts/migrate-database.js
          node --check express-project/scripts/init-database.js
          git diff --check
          grep -q "p.ip_location as location" express-project/routes/posts.js
          grep -q "c.ip_location as user_location" express-project/routes/comments.js
          grep -q "ip_location" express-project/scripts/init-database.sql

      - name: Commit changes and remove one-time workflow
        run: |
          rm -f .github/workflows/apply-content-location.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist IP location per post and comment"
          git push origin HEAD:main
