name: Media Pipeline Review

on:
  push:
    branches:
      - fix/media-pipeline-review
    paths:
      - express-project/**
      - vue3-project/**
      - miniprogram-project/**
      - .github/workflows/media-pipeline-review.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --progress=plain -t xiaomao-backend-review ./express-project
      - name: Verify Node and Sharp
        run: docker run --rm --entrypoint node xiaomao-backend-review -e "const sharp=require('sharp'); console.log(process.version, sharp.versions.sharp, sharp.versions.vips)"
      - name: Check Mini Program JavaScript syntax
        run: |
          node --check miniprogram-project/pages/publish/index.js
          node --check miniprogram-project/pages/post-detail/index.js
          node --check miniprogram-project/utils/media.js
      - name: Build Web frontend
        working-directory: vue3-project
        run: |
          npm ci --no-audit --no-fund
          npm run build
