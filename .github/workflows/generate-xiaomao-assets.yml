name: Generate XiaoMao visual assets

on:
  push:
    branches:
      - chore/xiaomao-visual-assets
    paths:
      - .github/workflows/generate-xiaomao-assets.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/xiaomao-visual-assets

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pillow

      - name: Generate branded images and update references
        shell: bash
        run: |
          cat > /tmp/generate_assets.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json

          ROOT = Path.cwd()
          SRC = ROOT / 'vue3-project' / 'src' / 'assets' / 'imgs'
          PUBLIC = ROOT / 'vue3-project' / 'public'
          DOC = ROOT / 'doc' / 'imgs'
          SRC.mkdir(parents=True, exist_ok=True)
          PUBLIC.mkdir(parents=True, exist_ok=True)
          DOC.mkdir(parents=True, exist_ok=True)

          ORANGE = '#F59E0B'
          ORANGE_LIGHT = '#FDBA4A'
          CREAM = '#FFF7E8'
          BROWN = '#5B2A0C'
          BG = '#FFF8EE'
          MUTED = '#8A6A55'

          font_candidates = [
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc',
              '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
              '/usr/share/fonts/truetype/noto/NotoSansCJK-Bold.ttc',
          ]
          font_path = next((p for p in font_candidates if Path(p).exists()), None)
          if not font_path:
              raise RuntimeError('Noto Sans CJK font not found')

          def font(size, bold=True):
              return ImageFont.truetype(font_path, size=size, index=0)

          def draw_paw(draw, box, fill=ORANGE, outline=BROWN, stroke=5):
              x0, y0, x1, y1 = box
              w, h = x1-x0, y1-y0
              def ell(cx, cy, rx, ry):
                  draw.ellipse((cx-rx, cy-ry, cx+rx, cy+ry), fill=fill, outline=outline, width=stroke)
              ell(x0+w*0.22, y0+h*0.28, w*0.10, h*0.14)
              ell(x0+w*0.42, y0+h*0.17, w*0.10, h*0.15)
              ell(x0+w*0.62, y0+h*0.18, w*0.10, h*0.15)
              ell(x0+w*0.80, y0+h*0.31, w*0.09, h*0.13)
              draw.ellipse((x0+w*0.19, y0+h*0.40, x0+w*0.84, y0+h*0.94), fill=fill, outline=outline, width=stroke)
              # subtle highlights
              hi = max(2, stroke//2)
              draw.ellipse((x0+w*0.29, y0+h*0.49, x0+w*0.40, y0+h*0.59), fill='#FFD98A')
              draw.ellipse((x0+w*0.28, y0+h*0.16, x0+w*0.34, y0+h*0.22), fill='#FFE4A8')

          def wordmark(size=(560, 200)):
              im = Image.new('RGBA', size, (0,0,0,0))
              d = ImageDraw.Draw(im)
              paw_w = int(size[1]*0.83)
              draw_paw(d, (10, 10, 10+paw_w, size[1]-10), stroke=max(4, size[1]//30))
              text = '小毛毛'
              f = font(int(size[1]*0.42))
              tx = paw_w + 28
              bbox = d.textbbox((0,0), text, font=f, stroke_width=0)
              ty = (size[1] - (bbox[3]-bbox[1]))//2 - bbox[1]
              d.text((tx, ty), text, font=f, fill=CREAM, stroke_width=max(4, size[1]//24), stroke_fill=BROWN)
              d.text((tx, ty), text, font=f, fill=CREAM, stroke_width=max(1, size[1]//80), stroke_fill=ORANGE_LIGHT)
              return im

          def square_paw(size=512, transparent=False):
              bg = (0,0,0,0) if transparent else BG
              im = Image.new('RGBA', (size,size), bg)
              d = ImageDraw.Draw(im)
              if not transparent:
                  pad = int(size*0.035)
                  d.rounded_rectangle((pad,pad,size-pad-1,size-pad-1), radius=int(size*0.22), fill='#FFF1D6', outline=ORANGE_LIGHT, width=max(2,int(size*0.018)))
              draw_paw(d, (int(size*0.13), int(size*0.10), int(size*0.87), int(size*0.89)), stroke=max(2,int(size*0.025)))
              return im

          wm = wordmark()
          wm.save(SRC / '小毛毛.png', optimize=True)
          wm.save(DOC / '小毛毛.png', optimize=True)

          paw512 = square_paw(512)
          paw512.save(SRC / '小毛毛爪印.png', optimize=True)
          paw512.save(SRC / 'avatar.png', optimize=True)

          placeholder = Image.new('RGB', (800,600), '#F6F2EC')
          d = ImageDraw.Draw(placeholder)
          d.rounded_rectangle((24,24,776,576), radius=34, fill='#FFFCF7', outline='#E6DDD2', width=4)
          small_wm = wordmark((440,158))
          placeholder.paste(small_wm, ((800-small_wm.width)//2, 190), small_wm)
          f2 = font(30, bold=False)
          text = '图片暂未加载'
          bb = d.textbbox((0,0), text, font=f2)
          d.text(((800-(bb[2]-bb[0]))/2, 392), text, font=f2, fill=MUTED)
          placeholder.save(SRC / '未加载.png', optimize=True, quality=92)

          for size, filename in [
              (192, 'android-icon-192x192.png'),
              (512, 'android-icon-512x512.png'),
              (180, 'apple-touch-icon.png'),
              (32, 'favicon-32x32.png'),
              (64, 'favicon-64x64.png'),
          ]:
              square_paw(size).save(PUBLIC / filename, optimize=True)

          square_paw(256).save(PUBLIC / 'logo.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])

          replacements = {
              ROOT / 'vue3-project/src/views/layout/components/LayoutHeader.vue': [
                  ('@/assets/imgs/小毛毛.svg', '@/assets/imgs/小毛毛.png'),
              ],
              ROOT / 'vue3-project/src/views/admin/AdminLayout.vue': [
                  ('@/assets/imgs/小毛毛.svg', '@/assets/imgs/小毛毛爪印.png'),
              ],
              ROOT / 'vue3-project/src/components/modals/AboutModal.vue': [
                  ('@/assets/imgs/小毛毛.svg', '@/assets/imgs/小毛毛爪印.png'),
              ],
          }
          for path, reps in replacements.items():
              content = path.read_text(encoding='utf-8')
              for old, new in reps:
                  content = content.replace(old, new)
              path.write_text(content, encoding='utf-8')

          header = ROOT / 'vue3-project/src/views/layout/components/LayoutHeader.vue'
          content = header.read_text(encoding='utf-8')
          content = content.replace('    width: 68.32px;\n    height: 32px;\n    color: var(--button-text-color);\n    background: var(--primary-color);', '    width: 112px;\n    height: 40px;\n    color: var(--button-text-color);\n    background: transparent;', 1)
          content = content.replace('img {\n    width: 68.32px;\n    height: 32px;\n}', 'img {\n    width: 112px;\n    height: 40px;\n    object-fit: contain;\n}', 1)
          header.write_text(content, encoding='utf-8')

          manifest_path = PUBLIC / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = '小毛毛 - 毛毛的快乐狗生'
          manifest['short_name'] = '小毛毛'
          manifest['theme_color'] = '#F59E0B'
          manifest['background_color'] = '#FFF8EE'
          manifest['description'] = '小毛毛 - 毛毛的快乐狗生'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python /tmp/generate_assets.py

      - name: Verify old branding is gone
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.gif' --exclude='*.webp' --exclude='*.ico' '小石榴|石榴号' .; then
            echo 'Old branding remains in tracked text files.' >&2
            exit 1
          fi

      - name: Build frontend
        working-directory: vue3-project
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit generated assets
        run: |
          rm -rf vue3-project/dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/imgs/小毛毛.png \
                  vue3-project/public \
                  vue3-project/src/assets/imgs/小毛毛.png \
                  vue3-project/src/assets/imgs/小毛毛爪印.png \
                  vue3-project/src/assets/imgs/avatar.png \
                  vue3-project/src/assets/imgs/未加载.png \
                  vue3-project/src/views/layout/components/LayoutHeader.vue \
                  vue3-project/src/views/admin/AdminLayout.vue \
                  vue3-project/src/components/modals/AboutModal.vue
          git diff --cached --quiet && exit 0
          git commit -m 'feat: complete XiaoMao visual identity assets'
          git push origin HEAD:chore/xiaomao-visual-assets
