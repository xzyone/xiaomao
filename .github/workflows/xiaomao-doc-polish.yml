name: Polish XiaoMao English docs

"on":
  push:
    branches:
      - chore/xiaomao-branding-final

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Fix mixed-language legacy names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'Pear毛毛': 'XiaoMao',
              'Small毛毛Image and Text Community': 'XiaoMao Community',
              'Small 毛毛 Image and Text Community': 'XiaoMao Community',
          }

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == Path('.github/workflows/xiaomao-doc-polish.yml'):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          for item in changed:
              print(f'  - {item}')
          PY

          if git grep -n -I -E 'Pear毛毛|Small毛毛|Small 毛毛'; then
            echo 'Mixed-language legacy branding remains.' >&2
            exit 1
          fi

      - name: Commit documentation cleanup
        shell: bash
        run: |
          rm -f .github/workflows/xiaomao-doc-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: polish XiaoMao English branding'
          git push origin HEAD:${GITHUB_REF_NAME}
