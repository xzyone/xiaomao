name: Cleanup legacy branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete every remote branch except main
        run: |
          git fetch origin --prune
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            case "$ref" in
              HEAD|main) continue ;;
            esac
            echo "Deleting origin/$ref"
            git push origin --delete "$ref"
          done

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/cleanup-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove branch cleanup workflow"
          git push origin HEAD:main
