name: Apply configurable post review policy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-review-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply review policy implementation
        run: python .github/scripts/apply_review_policy.py

      - name: Validate backend syntax
        run: |
          cd express-project
          npm ci --no-audit --no-fund
          node --check utils/reviewPolicy.js
          node --check scripts/migrate-database.js
          node --check scripts/init-database.js
          node --check routes/posts.js
          node --check routes/admin.js

      - name: Build frontend
        run: |
          cd vue3-project
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate review policy wiring
        run: |
          grep -q "post_review_exempt" express-project/routes/admin.js
          grep -q "post_review_enabled" express-project/utils/reviewPolicy.js
          grep -q "resolvePostStatus" express-project/routes/posts.js
          grep -q "status: 0 // 发布意图" vue3-project/src/views/publish/index.vue
          grep -q "发布审核模式" vue3-project/src/views/admin/PostAudit.vue
          grep -q "内容免审" vue3-project/src/views/admin/UserManagement.vue
          if grep -q "status: 2 // 发布状态：2=待审核" vue3-project/src/views/publish/index.vue; then
            echo "Legacy hard-coded review status still exists" >&2
            exit 1
          fi

      - name: Commit implementation and remove temporary files
        run: |
          rm -f .github/workflows/apply-review-policy.yml
          rm -f .github/scripts/apply_review_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add configurable post review policy"
          git push origin HEAD:main
