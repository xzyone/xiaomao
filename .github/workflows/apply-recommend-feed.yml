name: Apply chronological recommendation feed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recommend-feed.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply recommendation feed patch
        run: python .github/scripts/simplify_recommend_feed.py

      - name: Validate backend syntax
        run: |
          cd express-project
          npm ci --no-audit --no-fund
          node --check routes/posts.js

      - name: Validate recommendation behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('express-project/routes/posts.js').read_text(encoding='utf-8')
          required = [
              "category && category !== 'recommend'",
              "ORDER BY p.created_at DESC LIMIT ? OFFSET ?",
              "SELECT COUNT(*) as total FROM posts p WHERE p.status = ?",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected recommendation logic: {item}')
          forbidden = [
              'recommendLimit',
              'TIMESTAMPDIFF(HOUR, p.created_at, NOW())',
              'p.view_count * 0.7',
              'Math.ceil(totalPosts * 0.2)',
              '推荐频道的总数限制为总笔记数的20%',
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'Legacy recommendation logic still present: {item}')
          print('Recommendation feed validation passed')
          PY

      - name: Commit implementation and remove temporary files
        run: |
          rm -f .github/workflows/apply-recommend-feed.yml
          rm -f .github/scripts/simplify_recommend_feed.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make recommendations chronological across categories"
          git push origin HEAD:main
